<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Monitor — Mockup Breakdown (PDF)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
@page { size: A4 landscape; margin: 0; }
* { animation: none !important; transition: none !important; }
body { background: #dfe4e9; }
#root { height: auto; }
.hint {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  background: #1a222b;
  color: #e9eef4;
  font-family: var(--font-mono);
  font-size: 12px;
}
.hint strong { color: #ffb224; }
.sheet {
  width: 297mm;
  height: 209.5mm;
  margin: 14px auto;
  background: #ffffff;
  box-shadow: 0 2px 14px rgba(26, 34, 43, 0.18);
  display: flex;
  flex-direction: column;
  padding: 11mm 12mm 9mm;
  position: relative;
  overflow: hidden;
  break-after: page;
}
.sheet:last-child { break-after: auto; }
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 5mm;
  border-bottom: 1.5px solid var(--line);
  margin-bottom: 6mm;
}
.sheet-head .sh-right { color: var(--faint); }
.sheet-foot {
  margin-top: auto;
  padding-top: 4mm;
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: space-between;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
}
.cover { justify-content: center; gap: 0; }
.cover-kicker { margin-bottom: 4mm; }
.cover h1 {
  margin: 0 0 8mm;
  font-size: 48px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.05;
}
.cover-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6mm;
  border-top: 1.5px solid var(--line);
  padding-top: 6mm;
  margin-bottom: 8mm;
}
.cover-meta .cm-item { display: flex; flex-direction: column; gap: 1.5mm; }
.cover-meta .cm-val { font-size: 13.5px; font-weight: 600; }
.toc { display: flex; flex-direction: column; gap: 2.5mm; border-top: 1px solid var(--line-soft); padding-top: 7mm; }
.toc-row { display: flex; gap: 4mm; align-items: baseline; font-size: 13.5px; }
.toc-row .toc-num { font-family: var(--font-mono); font-size: 11.5px; color: var(--amber); font-weight: 600; min-width: 8mm; }
.toc-row .toc-page { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); }

.dash-frame { height: 152mm; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.dash-frame .app { height: 100%; }
.overview-legend {
  display: flex;
  gap: 3mm;
  margin-top: 5mm;
  flex-wrap: wrap;
}
.dash-pin {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffb224;
  color: #0c1015;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 11.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  border: 2px solid #ffffff;
  pointer-events: none;
  z-index: 10;
}
.ov-chip {
  display: inline-flex;
  align-items: center;
  gap: 2.5mm;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 2mm 3mm;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
}
.ov-chip b { color: var(--amber); font-weight: 600; }

.state-rows { display: flex; flex-direction: column; }
.state-row {
  display: grid;
  grid-template-columns: 62mm 1fr;
  gap: 6mm;
  align-items: center;
  padding: 4mm 0;
  border-bottom: 1px solid var(--line-soft);
}
.state-row:last-child { border-bottom: none; }
.state-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.state-desc b { color: var(--text); }
.state-flow {
  margin-top: 6mm;
  display: flex;
  align-items: center;
  gap: 3mm;
  font-family: var(--font-mono);
  font-size: 11px;
  flex-wrap: wrap;
}
.sf-node {
  padding: 2.5mm 4mm;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--panel);
  font-weight: 600;
  letter-spacing: 0.06em;
}
.sf-node.n-run { color: var(--amber); border-color: var(--amber); }
.sf-node.n-done { color: var(--green); border-color: var(--green); }
.sf-node.n-term { color: var(--red); border-color: var(--red); }
.sf-arrow { color: var(--faint); }

.fig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; flex: 1; min-height: 0; }
.figure { display: flex; flex-direction: column; gap: 2.5mm; min-height: 0; }
.figure .fig-body {
  flex: 1;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 3px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--panel);
}
.figure .fig-body > .panel { border: none; border-radius: 0; flex: 1; }
.fig-cap { display: flex; flex-direction: column; gap: 1mm; }
.fig-cap .fc-name { font-size: 12.5px; font-weight: 600; }
.fig-cap .fc-name .fc-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid var(--amber);
  border-radius: 2px;
  padding: 0.5mm 1.5mm;
  margin-left: 2.5mm;
  letter-spacing: 0.08em;
  vertical-align: 2px;
}
.fig-cap .fc-desc { font-size: 10.5px; color: var(--muted); line-height: 1.5; }
.fig-controls { padding: 5mm; display: flex; flex-direction: column; gap: 5mm; justify-content: center; }
.fig-controls .fc-row { display: flex; align-items: center; gap: 4mm; flex-wrap: wrap; }
.dash-flow-note { margin-top: 3.5mm; flex: none; }

table.df { width: 100%; border-collapse: collapse; font-size: 10px; }
table.df th {
  text-align: left;
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
  border-bottom: 1.5px solid var(--line);
  padding: 1.5mm 2.5mm;
}
table.df td {
  border-bottom: 1px solid var(--line-soft);
  padding: 1.4mm 2.5mm;
  vertical-align: middle;
  line-height: 1.3;
}
table.df td.mono { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); white-space: nowrap; }
table.df td b { font-weight: 600; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; flex: 1; min-height: 0; }

@media print {
  body { background: #ffffff; }
  .hint { display: none; }
  .sheet { margin: 0; box-shadow: none; }
}
</style>
</head>
<body>
<div class="hint">
  <strong>Xuất PDF:</strong> Ctrl/Cmd + P → Destination <strong>Save as PDF</strong> → Margins <strong>None</strong> → bật <strong>Background graphics</strong> → Save.
</div>
